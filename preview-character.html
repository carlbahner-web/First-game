<!DOCTYPE html>
<html>
<head>
<title>Character Preview</title>
<style>
body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
canvas { border: 1px solid #333; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c" width="200" height="250"></canvas>
<script>
const ctx = document.getElementById('c').getContext('2d');
const SCALE = 3;

function drawPx(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
}

// Draw on a dark background
ctx.fillStyle = "#504228";
ctx.fillRect(0, 0, 200, 250);

// Base position (centered in canvas)
const sx = 75;
const sy = 120;

function px(x, y, w, h, color) {
    drawPx(sx + x, sy + y, w, h, color);
}

// === BODY (teal shirt) ===
px(9, 6, 30, 30, "#2a6a6a");
px(9, 6, 6, 30, "#1e5454");
px(33, 6, 6, 30, "#1e5454");
px(15, 9, 18, 3, "#347a7a");
px(12, 30, 24, 3, "#1e5454");
px(15, 6, 18, 3, "#235e5e");
px(18, 3, 12, 3, "#235e5e");

// === HEAD (bald, round) ===
px(6, -15, 36, 21, "#E8CBA8");
px(9, -18, 30, 3, "#E8CBA8");
px(12, -21, 24, 3, "#E8CBA8");
px(15, -24, 18, 3, "#E8CBA8");
// Bald shine
px(15, -24, 18, 3, "#F5E2CC");
px(12, -21, 24, 3, "#F2DCC0");
px(15, -18, 18, 3, "#F0D8BA");
// Ears
px(3, -9, 6, 9, "#DFC09E");
px(39, -9, 6, 9, "#DFC09E");
px(3, -6, 3, 3, "#D4B08A");
px(42, -6, 3, 3, "#D4B08A");

// === BEARD ===
px(9, -3, 30, 12, "#1a1a2e");
px(6, -3, 6, 9, "#1a1a2e");
px(36, -3, 6, 9, "#1a1a2e");
px(12, 9, 24, 6, "#1a1a2e");
px(15, 15, 18, 3, "#222238");
px(12, 0, 3, 3, "#252540");
px(21, 3, 3, 3, "#252540");
px(30, 0, 3, 3, "#252540");
px(12, -6, 24, 3, "#222238");
px(18, -3, 12, 2, "#14141e");

// === EYES ===
// Eye whites
px(11, -12, 10, 8, "#F0F0E8");
px(27, -12, 10, 8, "#F0F0E8");
// Pupils
px(14, -10, 5, 5, "#1a1a2e");
px(30, -10, 5, 5, "#1a1a2e");
// Highlights
px(15, -10, 2, 2, "#F0F0E8");
px(31, -10, 2, 2, "#F0F0E8");
// Eyebrow ridges
px(10, -14, 12, 2, "#D4B08A");
px(26, -14, 12, 2, "#D4B08A");

// === FEET ===
px(12, 36, 9, 6, "#C4A882");
px(27, 36, 9, 6, "#C4A882");
px(12, 40, 9, 2, "#A08868");
px(27, 40, 9, 2, "#A08868");
px(12, 34, 9, 3, "#1e5454");
px(27, 34, 9, 3, "#1e5454");

// Label
ctx.fillStyle = "#EBEBE3";
ctx.font = "12px monospace";
ctx.textAlign = "center";
ctx.fillText("48x48 Player Sprite", 100, 235);
</script>
</body>
</html>
