<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attack of the Groove Goblins</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #232321;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: monospace;
        }
        /* The HUD overlays the room's bottom wall band instead of sitting in
           its own strip, so the page only has to fit the 1920x800 room. */
        #game-container {
            position: relative;
            line-height: 0;
            border: 4px solid #2C2C2A;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            /* Scale to fit the window while preserving the room's 1920x800
               aspect ratio. The internal resolution is unchanged — this is
               display scaling only. */
            width: min(calc(100vw - 16px), calc((100vh - 18px) * 2.4));
            height: auto;
        }
        #game { display: block; }
        #hud {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game"></canvas>
        <canvas id="hud"></canvas>
    </div>
    <script src="game.js"></script>
</body>
</html>
