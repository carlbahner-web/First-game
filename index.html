<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUZZ's Rhythm Rampage</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #232321;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: monospace;
        }
        /* The HUD overlays the room's bottom wall band instead of sitting in
           its own strip, so the page only has to fit the 1920x800 room. */
        #game-container {
            position: relative;
            line-height: 0;
            border: 4px solid #2C2C2A;
        }
        canvas {
            /* NOT `pixelated`: that forces nearest-neighbour at the final
               scale, and the canvas is almost never displayed at an integer
               multiple of 1920 — so it was dropping or doubling pixel columns
               at random across BUZZ's ink lines. He's hand-drawn art now, not
               a pixel-art sprite; he wants a real filter. */
            image-rendering: auto;
            /* Scale to fit the window while preserving the room's 1920x800
               aspect ratio. The internal resolution is unchanged — this is
               display scaling only. */
            width: min(calc(100vw - 16px), calc((100vh - 18px) * 2.0));
            height: auto;
        }
        #game { display: block; }
        #hud {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            /* The readout must never eat a tap. It is a canvas stacked over the
               bottom of the play field, and the game is driven by tapping. */
            pointer-events: none;
        }
        /* Paper grain. Sized to its own CSS pixel box (x dpr) and filled 1:1 —
           NEVER stretched — because a pattern squeezed at fill time reads as
           pixelation, and the two canvases underneath would magnify it. */
        #grain {
            position: absolute;
            left: 0; top: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game"></canvas>
        <canvas id="hud"></canvas>
        <canvas id="grain"></canvas>
    </div>
    <script src="game.js"></script>
</body>
</html>
