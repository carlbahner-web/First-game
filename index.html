<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attack of the Groove Goblins</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #162628;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: monospace;
        }
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #game {
            border: 4px solid #7a5430;
            border-bottom: 2px solid #7a5430;
        }
        #hud {
            border: 4px solid #7a5430;
            border-top: 2px solid #7a5430;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game"></canvas>
        <canvas id="hud"></canvas>
    </div>
    <script src="game.js"></script>
</body>
</html>
