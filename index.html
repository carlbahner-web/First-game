<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Quest</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a2f33;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: monospace;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 4px solid #BF7538;
        }
        #info {
            position: fixed;
            bottom: 16px;
            color: #BFCDC0;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <div id="info">Arrow keys: Move &nbsp;|&nbsp; Space: Sword attack &nbsp;|&nbsp; Enter: Start/Stop</div>
    <script src="game.js"></script>
</body>
</html>
