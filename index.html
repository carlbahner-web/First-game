<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attack of the Groove Goblins</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #232321;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: monospace;
        }
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            /* Scale to fit the window while preserving the 1792x864 total
               aspect ratio (game 768 + HUD 96 = 864 tall). The internal
               canvas resolution is unchanged — this is display scaling only. */
            width: min(calc(100vw - 16px), calc((100vh - 26px) * 2.074));
            height: auto;
        }
        #game {
            border: 4px solid #2C2C2A;
            border-bottom: 2px solid #2C2C2A;
        }
        #hud {
            border: 4px solid #2C2C2A;
            border-top: 2px solid #2C2C2A;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game"></canvas>
        <canvas id="hud"></canvas>
    </div>
    <script src="game.js"></script>
</body>
</html>
